# podvm_payload image from where we get kata binaries artifacts, e.g. pause-bundle, kata-agent and guest components
# https://github.com/openshift/cloud-api-adaptor/tree/osc-release
# Must be RHEL 10 based
PODVM_PAYLOAD_IMAGE=quay.io/redhat-user-workloads/ose-osc-tenant/osc-podvm-payload@sha256:33faaf1ca2edd6835cba8b272a291a0aa1a35908d52d4ec90f7d194828c9c1f8
# Base image used to build the NVIDIA drivers
# Must be RHEL 10 based
NVIDIA_DRIVERS_BASE_IMAGE=registry.access.redhat.com/ubi10:10.2-1781510001
# NVIDIA Driver Version
NVIDIA_DRIVERS_VERSION=595.58.03
# kernel-core package version, without the arch suffix (arch is derived at build time via uname -m)
# Must be RHEL 10 based
KERNEL_VERSION=6.12.0-211.61.1.el10_2
# List of runtime classes to pre-build initrds for per architecture (space-separated, no quotes)
# "kata-osbuilder.sh -h" shows the list of supported runtime classes
# The build dynamically resolves PRE_BUILD_INITRDS based on the target platform architecture
PRE_BUILD_INITRDS_x86_64=kata-cc kata-nvidia-gpu kata-cc-nvidia-gpu
PRE_BUILD_INITRDS_s390x=kata-cc


apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/confidential-compute-artifacts?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "osc-release-v1.14" && ( "containerfiles/storage-helper/***".pathChanged() || ".tekton/osc-storage-helper-push.yaml".pathChanged() )
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: openshift-sandboxed-containers-v1-14
    appstudio.openshift.io/component: osc-storage-helper-v1-14
    pipelines.appstudio.openshift.io/type: build
  name: osc-storage-helper-v1-14-on-push
  namespace: ose-osc-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ose-osc-tenant/osc-storage-helper-v1-14:{{revision}}
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/s390x
  - name: dockerfile
    value: Containerfile
  - name: path-context
    value: containerfiles/storage-helper
  - name: prefetch-input
    value: '[{"type": "rpm", "path": "./containerfiles/storage-helper/"}]'
  pipelineRef:
    resolver: git
    params:
      - name: org
        value: redhat
      - name: scmType
        value: github
      - name: serverURL
        value: https://github.com
      - name: url
        value: "https://github.com/openshift/sandboxed-containers-operator.git"
      - name: revision
        value: devel
      - name: pathInRepo
        value: ".tekton/build-pipeline.yaml"
  taskRunTemplate:
    serviceAccountName: build-pipeline-osc-storage-helper-v1-14
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
